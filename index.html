<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตรวจบัญชี NICE CARS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ee;--pri:#1f6feb;--ok:#14803c;--okbg:#e4f6ea;--warn:#b45309;--warnbg:#fff3dc;--bad:#b42318;--badbg:#fde8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:14px}
header{background:#101828;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:#cbd5e1;border:1px solid #344054;padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:#101828;border-color:#fff;font-weight:700}
.spacer{flex:1}
.banner{background:var(--warnbg);color:var(--warn);padding:8px 20px;font-size:13px}
main{padding:14px 16px;max-width:none;margin:0 auto}
.tx{table-layout:fixed;width:100%;min-width:1100px}
.tx th,.tx td{padding:6px 7px;font-size:13px;overflow-wrap:anywhere}
.tx td input[type=text],.tx td select,.tx td textarea{width:100%;min-width:0;box-sizing:border-box}
.tx td textarea{resize:vertical;overflow:hidden}
.tx .desc{max-width:none}
.tx .badge{white-space:normal}
.tx .chip{padding:4px 8px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{background:#eef4ff;color:#1f4fb4;border-radius:99px;padding:2px 4px 2px 9px;font-size:12px;white-space:nowrap}
.tag a{cursor:pointer;margin-left:3px;padding:0 5px;color:#667085;text-decoration:none}
.tag a:hover{color:var(--bad)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tx .tags input.addcar{flex:1 1 90px;min-width:90px;width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{color:var(--mute);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select,button{font:inherit}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--bad)}
.drop{border:2px dashed #b8c2d1;border-radius:12px;padding:14px;text-align:center;color:var(--mute);background:#fff;margin-bottom:12px}
.drop.over{border-color:var(--pri);background:#eef4ff}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{background:#f0f2f6;text-align:left;font-weight:500;font-size:12px;color:var(--mute);padding:8px 10px;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.in{color:var(--ok);cursor:pointer}.out{color:var(--bad);cursor:pointer}
td input[type=text]{width:78px}
td select{width:100px}
.desc{max-width:300px;color:#394150;font-size:13px;word-break:break-word}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;white-space:nowrap}
.b-clear{background:var(--okbg);color:var(--ok)}
.b-pend{background:var(--badbg);color:var(--bad)}
.b-none{background:var(--warnbg);color:var(--warn)}
.b-grey{background:#eceff4;color:var(--mute)}
.warn{font-size:12px;color:var(--bad);margin-top:3px;line-height:1.35}
.stg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;margin:1px 2px 1px 0;border:1px solid var(--line);color:#9aa4b2;background:#fff}
.stg.have{background:var(--okbg);color:var(--ok);border-color:#b9e4c8}
.stg.auto{background:#f1faf4;color:#6fa585;border:1px dashed #b9e4c8}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal.show{display:flex}
.box{background:#fff;border-radius:14px;padding:18px;max-width:880px;width:100%}
.box h3{margin:0 0 10px}
pre{background:#101828;color:#d0d5dd;padding:10px;border-radius:8px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap}
.kw label{display:block;margin:8px 0 3px;font-weight:500}
.kw input{width:100%}
.muted{color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
</style>

<body>
<header>
  <h1>🚗 ตรวจบัญชีเต็นท์ · NICE CARS</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="btn sec" id="btnKw">⚙️ คำค้นชนิด</button>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ===================== ตั้งค่า Supabase =====================
// ใส่ค่าจาก Supabase project (ใช้โปรเจกต์เดิมของ NICE CARS ได้)
// ถ้าเว้นว่าง เว็บจะทำงานแบบทดลอง เก็บข้อมูลในเครื่องนี้เท่านั้น
// ใช้ Supabase โปรเจกต์เดียวกับ NICE CARS (สลับฐานจริง/ทดสอบตามชื่อโฮสต์ เหมือนระบบเต็นท์)
// ใส่ publishable key ของแต่ละฐาน (ถ้าเว้นว่าง เว็บจะอยู่โหมดทดลอง เก็บข้อมูลในเบราว์เซอร์)
const CONFIGS = {
  production: { url:'https://vlbysgrmnuhbubgzdmar.supabase.co', key:'sb_publishable_P1UOIzNROBbFHUSXFxST2w_wc1yF-3U' },
  test:       { url:'https://qrtiqktriefakjlmhdvq.supabase.co', key:'' }
};
const PROD_HOSTS = ['nicecarsaccount.vercel.app'];   // ใส่โดเมนจริงของเว็บนี้ เช่น 'nicecars-accounts.vercel.app' (โดเมนอื่น/localhost = ฐานทดสอบ)
const IS_PROD = typeof location!=='undefined' && PROD_HOSTS.indexOf(location.hostname)!==-1;
const SUPABASE_URL = (IS_PROD?CONFIGS.production:CONFIGS.test).url;
const SUPABASE_KEY = (IS_PROD?CONFIGS.production:CONFIGS.test).key;
// รหัสเข้าเว็บ: ใส่ค่า SHA-256 ของรหัส (เว้นว่างไว้ แล้วเปิดเว็บ จะมีช่องให้ตั้งรหัสและสร้างค่ามาให้คัดลอก)
const ACCESS_HASH = 'cffd5226ebeac82ca1a8fdad0ee038345b56e10e3c63b384ae97453c19f218d0';

// ==LOGIC-START==
const ACCOUNTS = {deposit:'เงินจอง', pool:'กองกลาง'};
const PAIR = ['จำนำ','ซื้อรถ'];                          // เงื่อนไข 1: ต้องมีครบทั้งคู่
const SEQ  = ['จอง','ปล่อยรถ','คืนจำนำ','ปันผล'];      // เงื่อนไข 2: ต้องเรียงตามลำดับ
const ALL_STATUS = [...PAIR, ...SEQ];
const DEFAULT_KW = {'จำนำ':['จำนำ'],'ซื้อรถ':['ซื้อรถ','ซื้อ'],'คอมซื้อ':['คอมซื้อ'],'คอมขาย':['คอมขาย'],'จอง':['จอง'],'ปล่อยรถ':['ปล่อยรถ'],'คืนจำนำ':['คืนจำนำ'],'ปันผล':['ปันผล']};
const pad = (n,l=2)=>String(n).padStart(l,'0');
const r2 = n=>Math.round(n*100)/100;
const THMON = {'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};

function normCode(letter, num){ return letter.toUpperCase()+String(num); }   // เทียบรหัสแบบเป๊ะ ๆ ตามที่เขียน ไม่เติมเลข 0
const splitCodes=v=>String(v||'').split(/[\s,;/]+/).filter(Boolean);
function normInput(v, letter){   // รองรับหลายรหัส คั่นด้วย , ; / หรือช่องว่าง
  return String(v||'').replace(/([A-Za-z])[\s-]+(\d)/g,'$1$2').split(/[\s,;/]+/).map(x=>x.replace(/-/g,'').toUpperCase()).filter(Boolean).join(',');
}
// ชนิด -> เติมช่อง "จาก" ให้อัตโนมัติ (ใช้เฉพาะเมื่อช่องจากยังว่าง)
function fromByStatus(account,status){
  if(status==='จำนำ'||status==='คืนจำนำ') return 'ป๊า';
  if(status==='คอมซื้อ'||status==='คอมขาย') return 'นายหน้า';
  if(status==='ปันผล') return account==='deposit'?'กองกลาง':(account==='pool'?'เงินจอง':'');
  return '';
}
function extractCodes(text){
  const out={case_code:'',car_code:'',cars:[],multi:false};
  const re=/(?<![A-Za-z0-9])([CN])(\d{1,4})(?!\d)/gi; let m;
  while((m=re.exec(text||''))){
    const L=m[1].toUpperCase(), code=normCode(L,m[2]);
    const k=L==='C'?'case_code':'car_code';
    if(L==='N'&&!out.cars.includes(code)) out.cars.push(code);
    if(!out[k]) out[k]=code; else if(out[k]!==code) out.multi=true;
  }
  return out;
}
function detectStatus(text, kw){
  kw=kw||DEFAULT_KW; let work=' '+(text||'')+' ';
  const list=[]; for(const s of Object.keys(kw)) for(const w of (kw[s]||[])) if(w.trim()) list.push([w.trim(),s]);
  list.sort((a,b)=>b[0].length-a[0].length);
  const hits=[];
  for(const [w,s] of list){
    let i; while((i=work.indexOf(w))>=0){ hits.push([i,s]); work=work.slice(0,i)+' '.repeat(w.length)+work.slice(i+w.length); }
  }
  if(!hits.length) return {status:'',multi:false};
  hits.sort((a,b)=>a[0]-b[0]);
  return {status:hits[0][1], multi:new Set(hits.map(h=>h[1])).size>1};
}
function toISO(d,m,y){ y=+y; if(y<100) y = y>=50 ? y+2500-543 : y+2000; else if(y>2400) y-=543; return `${y}-${pad(m)}-${pad(d)}`; }

const MK='\u2063', MK2='\u2064';   // ตัวคั่นเริ่ม/จบคอลัมน์ รายละเอียด/บันทึกช่วยจำ
function splitMemo(s){
  const i=s.indexOf(MK); if(i<0) return {left:s,memo:''};
  const j=s.indexOf(MK2,i+1);
  return {left:s.slice(0,i)+' '+(j<0?'':s.slice(j+1)), memo:s.slice(i+1,j<0?s.length:j).replace(/\s+/g,' ').trim()};
}
function buildLine(items,memoX,memoRight){
  items=[...items].sort((a,b)=>a.x-b.x); let out='',inMemo=false;
  for(const it of items){
    const isMemo=memoX!=null&&it.x>=memoX&&it.x<(memoRight==null?Infinity:memoRight);
    if(isMemo&&!inMemo){out+=' '+MK;inMemo=true} else if(!isMemo&&inMemo){out+=MK2+' ';inMemo=false}
    out+=' '+it.s;
  }
  if(inMemo) out+=MK2;
  return out.replace(/[ \t]+/g,' ').trim();
}
const AMT_RE=/(?<![\d.,])-?\d{1,3}(?:,\d{3})*\.\d{2}(?!\d)/g;
const NUMDATE_RE=/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/;
const THDATE_RE=/(\d{1,2})\s?(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s?(\d{2,4})/;
const TIME_RE=/(?<!\d)(\d{1,2}):(\d{2})(?::\d{2})?(?!\d)/;

const OPEN_RE=/ยอดเงินคงเหลือยกมา|ยอดยกมา|BALANCE\s+BROUGHT\s+FORWARD|Balance\s*Forward|B\/F/i;
const CLOSE_RE=/ยอดยกไป|CARRIED\s+FORWARD|C\/F/i;
const num=s=>parseFloat(s.replace(/,/g,''));
// เลขทะเบียน: ต้องมีเลขนำหน้า (เช่น 1กก1234) หรือมีขีด (เช่น กข-1234) เพื่อกันคำไทยทั่วไปที่ตามด้วยตัวเลข
const PLATE_RE=/(?<!\d)(\d{1,2}\s?[ก-ฮ]{1,3}\s?-?\s?\d{1,4}|[ก-ฮ]{1,3}\s?-\s?\d{1,4})(?!\d)/;
function extractPlate(text){ const m=PLATE_RE.exec(text||''); return m?m[1].replace(/[\s-]/g,''):''; }
function splitLabels(full){
  const di=full.search(/DESC\s*[:：]/i), ni=full.search(/NOTE\s*[:：]/i);
  if(di<0&&ni<0) return {found:false};
  const first=Math.min(...[di,ni].filter(x=>x>=0));
  const seg=(a,b)=>full.slice(a,b<0?full.length:b);
  let desc='',note='';
  if(di>=0) desc=seg(di,ni>di?ni:-1).replace(/^DESC\s*[:：]\s*/i,'').trim();
  if(ni>=0) note=seg(ni,di>ni?di:-1).replace(/^NOTE\s*[:：]\s*/i,'').trim();
  return {found:true,prefix:full.slice(0,first).trim(),desc,note};
}
function parseStatementLines(lines){
  const rows=[]; let cur=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(OPEN_RE.test(line)){   // ยอดคงเหลือยกมา = จุดอ้างอิงตั้งต้นสำหรับเทียบเงินเข้า/ออกของรายการแรก
      const ns=line.match(AMT_RE); if(ns&&ns.length){ rows.push({opening:true,balance:num(ns[ns.length-1]),amount:null,dir:0,date:null,time:'',desc:'',memo:'',hint:''}); cur=null; continue; }
    }
    if(CLOSE_RE.test(line)){ cur=null; continue; }
    let dm=NUMDATE_RE.exec(line), iso=null, dstr=null;
    if(dm && dm.index<=4){ iso=toISO(dm[1],dm[2],dm[3]); dstr=dm[0]; }
    else { const tm=THDATE_RE.exec(line); if(tm && tm.index<=4){ iso=toISO(tm[1],THMON[tm[2]],tm[3]); dstr=tm[0]; } }
    if(iso){
      const sp=splitMemo(line); let rest=sp.left.replace(dstr,' ');
      const tmm=TIME_RE.exec(rest); let time=''; if(tmm){ time=pad(tmm[1])+':'+tmm[2]; rest=rest.replace(tmm[0],' '); }
      const nums=(rest.match(AMT_RE)||[]); rest=rest.replace(AMT_RE,' ');
      const val=s=>parseFloat(s.replace(/,/g,''));
      const opening=false;
      cur={date:iso,time,desc:rest.replace(/\s+/g,' ').trim(),memo:sp.memo,amount:null,balance:null,opening,dir:0,hint:rest+' '+sp.memo};
      if(nums.length>=2){ cur.balance=val(nums[nums.length-1]); cur.amount=Math.abs(val(nums[nums.length-2])); cur.neg=nums[nums.length-2].startsWith('-'); }
      else if(nums.length===1){ cur.balance=val(nums[0]); if(!opening) cur.amount=null; }
      rows.push(cur);
    } else if(cur && !/หน้า|page|รวม|Total/i.test(line)){
      const sp=splitMemo(line);
      if(!(sp.left.match(AMT_RE)||[]).length){
        if(sp.left.trim()) cur.desc=(cur.desc+' '+sp.left).replace(/\s+/g,' ').trim();
        if(sp.memo) cur.memo=(cur.memo+' '+sp.memo).trim();
        cur.hint=cur.desc+' '+cur.memo;
      }
    }
  }
  for(const r of rows){   // แยก "xx DESC : ... NOTE : ..." ออกเป็นส่วน ๆ
    const fl=splitLabels((r.desc+' '+(r.memo||'')).replace(/\s+/g,' ').trim());
    if(fl.found){ r.noteFound=true; r.prefix=fl.prefix; r.descTxt=fl.desc; r.note=fl.note||'-'; }
  }
  inferDirections(rows);
  return rows;
}
function inferDirections(rows){
  const n=rows.length;
  const run=asc=>{
    let ok=0; const dirs=new Array(n).fill(0);
    for(let i=1;i<n;i++){
      const idx=asc?i:i-1, later=rows[idx], earlier=asc?rows[i-1]:rows[i];
      if(later.opening||later.amount==null||later.balance==null||earlier.balance==null) continue;
      const d=r2(later.balance-earlier.balance);
      if(Math.abs(d-later.amount)<0.006){dirs[idx]=1;ok++}
      else if(Math.abs(d+later.amount)<0.006){dirs[idx]=-1;ok++}
    }
    return {ok,dirs};
  };
  const a=run(true), b=run(false), best=a.ok>=b.ok?a:b;
  rows.forEach((r,i)=>{
    r.dir=best.dirs[i];
    if(!r.dir && r.amount!=null){
      if(r.neg) r.dir=-1;
      else if(/ถอน|โอนออก|จ่าย|ชำระ|หัก/.test(r.hint)) r.dir=-1;
      else if(/ฝาก|รับโอน|โอนเข้า|รับ/.test(r.hint)) r.dir=1;
    }
  });
  return best.ok;
}
function makeTx(account,row,kw,source){
  // ถ้า Statement มี DESC : / NOTE : -> แสดง/ค้นรหัสจาก NOTE, DESC เก็บไว้ดูเพิ่ม
  let description=row.desc, memo=row.memo||'', ref=row.memo||row.desc;
  if(row.noteFound){ description=(row.prefix?row.prefix+' · ':'')+row.descTxt; memo=row.note; ref=row.note; }
  const codes=extractCodes(ref), st=detectStatus(ref,kw);
  // ทิศทางเงิน: ถ้าอ่านไม่ได้ ยังต้องเก็บจำนวนเงินไว้ (เดาเป็นเงินออก แล้วติดธง ?)
  let dir=row.dir, unk=false;
  if(dir===0&&row.amount!=null){
    if(row.balance!=null&&row.balance-row.amount<-0.005){ dir=-1; }          // ถ้าเป็นเงินเข้า ยอดก่อนหน้าจะติดลบ -> ต้องเป็นเงินออก
    else { dir=-1; unk=true; }
  }
  const debit=dir===-1?row.amount:0, credit=dir===1?row.amount:0;
  return {account,tx_date:row.date,tx_time:row.time,description,memo,debit:debit||0,credit:credit||0,balance:row.balance,
    case_code:codes.case_code,car_code:codes.cars.join(','),plate:extractPlate(ref),from_acc:fromByStatus(account,st.status),remark:'',car_link:'',status:st.status,manual_clear:false,source_file:source||'',
    dir_unknown:unk, uniq:[account,row.date,row.time,row.amount,row.balance,description,memo].join('|')};
}

// ---- กติกาเคลียร์ ----
// พบทะเบียนใน NOTE ตรงกับระบบเต็นท์ (เพียง 1 คัน) -> ใส่รหัสรถให้เลย + ติดธง car_link='auto' (รอยืนยัน)
function autoLinkOne(t,ref){
  if(!t||t.car_code||!t.plate||t.car_link==='rejected') return null;
  const s=ref&&ref.plates&&ref.plates.get(t.plate); if(!s||s.size!==1) return null;
  return {car_code:[...s][0],car_link:'auto'};
}
// ทะเบียนตรงกับหลายรหัสรถในระบบเต็นท์ -> ต้องให้เลือก/คอนเฟิร์ม (ไม่ autofill)
function plateChoices(t,ref){
  if(!t||t.car_code||!t.plate||t.car_link==='rejected') return [];
  const s=ref&&ref.plates&&ref.plates.get(t.plate); return (s&&s.size>1)?[...s].sort():[];
}
function evaluate(txs,ref){
  const sysP=(ref&&ref.plates)||new Map();
  // map เคส -> รถ (ใช้เมื่อเคสนั้นผูกกับรถเพียงคันเดียว)
  const c2c={}, p2c={};
  for(const t of txs){
    for(const c of splitCodes(t.car_code)){
      if(t.case_code) (c2c[t.case_code]=c2c[t.case_code]||new Set()).add(c);
      if(t.plate) (p2c[t.plate]=p2c[t.plate]||new Set()).add(c);
    }
  }
  for(const pl of new Set(txs.map(t=>t.plate).filter(Boolean))){ const sp=sysP.get(pl); if(sp) for(const c of sp) (p2c[pl]=p2c[pl]||new Set()).add(c); }   // ทะเบียนจากระบบเต็นท์ (car_details)
  // ทะเบียนเดียวกันแต่คนละรหัสรถ -> แจ้งเตือน
  const conflicts=new Map(); for(const [pl,s] of Object.entries(p2c)) if(s.size>1) conflicts.set(pl,[...s].sort());
  const subj=new Map(), txKey=new Map(), txKeys=new Map(), txVia=new Map();
  for(const t of txs){
    let keys=splitCodes(t.car_code), key=keys[0]||null;
    if(!key&&t.case_code){ const s=c2c[t.case_code]; if(s&&s.size===1){ key=[...s][0]; keys=[key]; txVia.set(t.id,'เคส '+t.case_code); } }
    if(!key&&t.plate&&t.car_link!=='rejected'){ const s=p2c[t.plate]; if(s&&s.size===1){ key=[...s][0]; keys=[key]; txVia.set(t.id,'ทะเบียน '+t.plate); } }
    if(!key){ key=t.case_code||t.plate||null; if(key) keys=[key]; }
    if(!key){ txKey.set(t.id,null); txKeys.set(t.id,[]); continue; }
    txKey.set(t.id,key); txKeys.set(t.id,keys);
    const multi=keys.length>1;
    for(const k of keys){
      if(!subj.has(k)) subj.set(k,{key:k,isCar:/^N\d/.test(k),plates:new Set(),have:new Set(),cases:new Set(),count:0,multiN:0,inSum:0,outSum:0,txs:[]});
      const s=subj.get(k); s.count++; s.txs.push(t); if(t.plate) s.plates.add(t.plate);
      if(t.status) s.have.add(t.status);
      if(t.case_code) s.cases.add(t.case_code);
      if(multi) s.multiN++; else { s.inSum+=+t.credit||0; s.outSum+=+t.debit||0; }   // รายการที่ใช้ร่วมหลายคัน ยังไม่แยกยอด จึงไม่นับ
    }
  }
  for(const s of subj.values()){
    // เงื่อนไข 1
    const miss1=PAIR.filter(x=>!s.have.has(x));
    s.rule1={ok:miss1.length===0,missing:miss1,present:PAIR.filter(x=>s.have.has(x))};
    // เงื่อนไข 2 : สเตจก่อนหน้าสเตจสูงสุดที่มี นับว่าเคลียร์ให้อัตโนมัติ
    let hi=-1; SEQ.forEach((x,i)=>{ if(s.have.has(x)) hi=i; });
    s.rule2={ok:hi===SEQ.length-1,hi,auto:SEQ.filter((x,i)=>i<hi&&!s.have.has(x)),missing:SEQ.slice(hi+1)};
    s.autoCleared=s.rule1.ok&&s.rule2.ok; s.allManual=s.txs.length>0&&s.txs.every(t=>t.manual_clear); s.cleared=s.autoCleared||s.allManual;
    s.warnings=[];
    if(!s.rule1.ok) s.warnings.push(s.rule1.present.length?`มี "${s.rule1.present[0]}" แล้ว ยังขาด "${s.rule1.missing[0]}"`:`ยังไม่มี "จำนำ" และ "ซื้อรถ"`);
    if(!s.rule2.ok) s.warnings.push((hi>=0?`ถึง "${SEQ[hi]}" แล้ว `:'ยังไม่เริ่ม ')+`ยังขาด: ${s.rule2.missing.join(' → ')}`);
    if(!s.isCar) s.warnings.push('ยังไม่ผูกรหัสรถ (Nxxx)');
    if(s.cleared) s.warnings=[];
    if(s.multiN) s.warnings.push(`มี ${s.multiN} รายการที่ใช้ร่วมหลายรหัสรถ — ต้องแจ้งยอดแยกรายคัน (ยังไม่นับยอดเข้าสรุป)`);
    s.conf=[...s.plates].filter(pl=>conflicts.has(pl)).map(pl=>({plate:pl,cars:conflicts.get(pl)}));
  }
  return {subj,txKey,txKeys,txVia,conflicts};
}
function txState(t,ev){
  if(t.manual_clear) return 'clear';
  if(!t.car_code&&!t.case_code) return 'nocode';
  if(!t.status) return 'nostatus';
  const ks=ev.txKeys&&ev.txKeys.get(t.id), list=(ks&&ks.length)?ks:[ev.txKey.get(t.id)];
  return list.every(k=>{ const s=ev.subj.get(k); return s&&s.cleared; })?'clear':'pending';
}
const fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function buildShortfall(ev){
  return [...ev.subj.values()].filter(s=>!s.cleared).sort((a,b)=>a.key.localeCompare(b.key)).map(s=>({
    key:s.key,isCar:s.isCar,cases:[...s.cases],miss1:s.rule1.missing,miss2:s.rule2.missing,
    inSum:r2(s.inSum),outSum:r2(s.outSum),net:r2(s.inSum-s.outSum)}));
}
function shortfallText(list){
  return list.map(x=>`${x.key}${x.isCar?'':' (ยังไม่ผูกรหัสรถ)'} | ขาด: ${[x.miss1.length?x.miss1.join(', '):'',x.miss2.length?x.miss2.join(' → '):''].filter(Boolean).join(' / ')} | ออก ${fmt(x.outSum)} เข้า ${fmt(x.inSum)} สุทธิ ${fmt(x.net)}`).join('\n');
}
const monthOf=t=>(t.tx_date||'').slice(0,7);
// อัปไฟล์ใหม่: รายการที่จับคู่กับของเดิมได้ (วันเวลา+ยอด หรือ วันที่+DESC+ยอด) ใช้ค่าที่เคยแก้/กรอกไว้ต่อ
function carryOver(newRows,oldRows){
  const amt=t=>Math.round(((+t.debit||0)||(+t.credit||0))*100)/100;
  const dk=t=>(t.description||'').replace(/\s+/g,' ').trim();
  const pool=oldRows.map(o=>({o,used:false}));
  const find=pred=>pool.find(p=>!p.used&&pred(p.o));
  let kept=0;
  const rows=newRows.map(n=>{
    const a=amt(n), tm=x=>x.tx_time||'';
    const m=find(o=>o.tx_date===n.tx_date&&tm(o)===tm(n)&&amt(o)===a&&(o.balance==null||n.balance==null||+o.balance===+n.balance))
         ||find(o=>o.tx_date===n.tx_date&&tm(o)===tm(n)&&amt(o)===a)
         ||find(o=>o.tx_date===n.tx_date&&amt(o)===a&&dk(o)&&dk(o)===dk(n));
    if(!m) return n;
    m.used=true; kept++;
    const o=m.o, r={...n};
    for(const f of ['memo','from_acc','car_code','case_code','plate','status','remark','car_link']){
      if(o[f]==null||o[f]==='') continue;
      if(f==='memo'&&o.memo==='-') continue;   // เดิมไม่มี NOTE -> ใช้ NOTE จากไฟล์ใหม่
      r[f]=o[f];
    }
    r.manual_clear=!!o.manual_clear;
    if(n.dir_unknown&&!o.dir_unknown){ r.debit=o.debit; r.credit=o.credit; r.dir_unknown=false; }
    return r;
  });
  return {rows,kept};
}
function closingOf(list){
  const key=t=>t.tx_date+'|'+(t.tx_time||'');
  const s=list.filter(t=>t.balance!=null).sort((a,b)=>key(a).localeCompare(key(b)));
  if(!s.length) return null;
  const last=s[s.length-1], tied=s.filter(t=>key(t)===key(last));
  if(tied.length===1) return last.balance;
  const delta=t=>r2((+t.credit||0)-(+t.debit||0));
  const closing=tied.find(a=>!tied.some(b=>b!==a&&Math.abs(r2(b.balance-a.balance)-delta(b))<0.006));
  return (closing||last).balance;
}

function bindDrop(){
  const d=$('#drop'); if(!d) return;

function askPassword(wrong){ return new Promise(res=>{
  showModal(`<h3>🔒 ไฟล์ PDF นี้มีรหัสผ่าน</h3>${wrong?'<p class="warn">รหัสไม่ถูกต้อง ลองอีกครั้ง</p>':'<p class="muted">ใส่รหัสเพื่อเปิดอ่านรายการ (รหัสจะไม่ถูกบันทึก)</p>'}
    <input type="password" id="pdfpw" style="width:100%" autocomplete="off">
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="pdfno">ยกเลิก</button><button class="btn" id="pdfok">ปลดล็อก</button></div>`);

async function pdfToLines(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const task=pdfjsLib.getDocument({data:await file.arrayBuffer()});
  let triedSaved=false;
  task.onPassword=async(cb,reason)=>{
    if(reason===1&&PDF_PW&&!triedSaved){ triedSaved=true; cb(PDF_PW); return; }
    const p=await askPassword(reason===2);
    if(p){ PDF_PW=p; cb(p); } else { CANCELLED=true; task.destroy(); }
  };
  const pdf=await task.promise, lines=[]; let memoX=null, memoRight=null;
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const items=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y);
    const groups=[]; let cy=null;
    for(const it of items){ if(cy===null||Math.abs(it.y-cy)>3){ groups.push([it]); cy=it.y; } else groups[groups.length-1].push(it); }
    for(const g of groups){
      const plain=g.slice().sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ');
      if(/รายละเอียด|บันทึกช่วยจำ/.test(plain)&&!NUMDATE_RE.test(plain)&&!THDATE_RE.test(plain)){   // แถวหัวตาราง -> จำตำแหน่งคอลัมน์
        const hs=g.filter(i=>/รายละเอียด|บันทึกช่วยจำ/.test(i.s)); memoX=Math.min(...hs.map(i=>i.x))-3;
        const right=g.filter(i=>i.x>memoX+60&&!/รายละเอียด|บันทึกช่วยจำ/.test(i.s)).map(i=>i.x);
        memoRight=right.length?Math.min(...right)-3:null;
      }
      const l=buildLine(g,memoX,memoRight); if(l) lines.push(l);
    }
  }
  return lines;
}

  wrap.innerHTML=ACCESS_HASH
    ?'<div class="box" style="max-width:340px"><h3>🔒 ใส่รหัสเข้าเว็บ</h3><input type="password" id="gp" style="width:100%" placeholder="รหัส"><p class="warn" id="gerr"></p><button class="btn" id="gb" style="width:100%">เข้าสู่ระบบ</button></div>'
    :'<div class="box" style="max-width:480px"><h3>🔒 ตั้งรหัสเข้าเว็บ</h3><p class="muted">พิมพ์รหัสที่ต้องการ แล้วคัดลอกค่าที่ได้ไปใส่ที่ <b>ACCESS_HASH</b> ในไฟล์ index.html</p><input type="text" id="gp" style="width:100%" placeholder="รหัสใหม่"><button class="btn" id="gb" style="width:100%;margin-top:8px">สร้างค่า</button><pre id="gout" style="margin-top:8px;display:none"></pre><button class="btn sec" id="gskip" style="margin-top:8px;width:100%">ข้ามไปก่อน (ยังไม่ล็อก)</button></div>';
  document.body.appendChild(wrap);
  await new Promise(res=>{
    const go=async()=>{ const v=$('#gp').value; if(!v) return; const h=await sha256(v);
      if(ACCESS_HASH){ if(h===ACCESS_HASH){ try{sessionStorage.setItem('stmt_ok',h)}catch(e){} wrap.remove(); res(); } else $('#gerr').textContent='รหัสไม่ถูกต้อง'; }
      else { const o=$('#gout'); o.style.display='block'; o.textContent=h; } };
    $('#gb').onclick=go; $('#gp').onkeydown=e=>{ if(e.key==='Enter') go(); };
    const sk=$('#gskip'); if(sk) sk.onclick=()=>{ wrap.remove(); res(); };
  });
}
(async()=>{
  await gate();
  try{
    S.txs=await DB.load(); let kw=await DB.loadKw();
    if(kw&&kw['ซื้อ']){ kw['ซื้อรถ']=[...new Set([...(kw['ซื้อรถ']||[]),...kw['ซื้อ'],'ซื้อรถ'])]; delete kw['ซื้อ']; try{ await DB.saveKw(kw); }catch(e){} }
    if(kw) S.kw={...DEFAULT_KW,...kw};
    for(const t of S.txs.filter(t=>t.status==='ซื้อ')){ t.status='ซื้อรถ'; try{ await DB.update(t.id,{status:'ซื้อรถ'}); }catch(e){} }
  }catch(err){ toast('โหลดข้อมูลไม่สำเร็จ: '+err.message); }
  try{ S.locks=await DB.loadMonths(); }catch(err){ toast('โหลดเดือนที่เซฟไม่ได้ (ยังไม่ได้รัน SQL ใหม่?): '+err.message); }
  await loadCars();
  recompute(); render();
})();
}
</script>
